media:
  input: images
  output: images
content:
  - name: news
    label: News
    type: file
    path: data/news.json
    format: json
    fields:
      - name: items
        label: News items
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: date, label: Date, type: date }
          - name: tag
            label: Tag
            type: select
            options:
              values: [News, Paper, Open position, Award, Outreach, Team, Event]
          - { name: text, label: Text, type: text }
          - { name: image, label: Photo (optional), type: image }
          - { name: link, label: Link (optional), type: string }
  - name: team
    label: Team
    type: file
    path: data/team.json
    format: json
    fields:
      - name: items
        label: Members
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: role, label: Position, type: string }
          - { name: photo, label: Photo, type: image }
          - { name: email, label: Email, type: string }
          - { name: linkedin, label: LinkedIn (URL), type: string }
          - { name: orcid, label: ORCID (ID or URL), type: string }
          - { name: bio, label: Interests (short line), type: text }
          - { name: past, label: Past member, type: boolean }
          - { name: years, label: Years in the group (past members), type: string }
          - { name: now, label: Current position (past members), type: string }
  - name: publications
    label: Publications
    type: file
    path: data/publications.json
    format: json
    fields:
      - name: items
        label: Publications
        type: object
        list: true
        fields:
          - { name: year, label: Year, type: number }
          - { name: title, label: Title, type: string }
          - { name: link, label: Link (DOI or URL), type: string }
          - { name: authors, label: Authors (put your name between ** **), type: string }
          - { name: journal, label: Journal, type: string }
  - name: funding
    label: Funding
    type: file
    path: data/funding.json
    format: json
    fields:
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - { name: title, label: Project title, type: string }
          - { name: agency, label: Funding agency, type: string }
          - { name: call, label: Call, type: string }
          - { name: reference, label: Reference, type: string }
          - { name: duration, label: Duration, type: string }
          - { name: pi, label: PI, type: string }
      - name: agencies
        label: Agency logos
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: logo, label: Logo, type: image }
          - { name: url, label: Website, type: string }
